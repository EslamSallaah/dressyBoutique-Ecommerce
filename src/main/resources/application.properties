spring.application.name=identity-service
server.port=8082
spring.datasource.url=jdbc:h2:file:./data/identity;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
ecommerce.jwt.secret=${JWT_SECRET:dev-only-change-this-secret-32-bytes-minimum}
ecommerce.frontend.origins=${FRONTEND_ORIGINS:http://localhost:5173}
